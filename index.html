<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
    }
    #score-display {
      font-size: 1.4rem;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: #a8ff78;
    }
    canvas {
      border: 2px solid #4a4a6a;
      border-radius: 4px;
      display: block;
      image-rendering: pixelated;
    }
    #hint {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #6a6a8a;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="score-display">SCORE: 0</div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="hint">ARROW KEYS or WASD to move</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');

    const CELL = 20;
    const COLS = canvas.width / CELL;   // 20
    const ROWS = canvas.height / CELL;  // 20
    const TICK = 130; // ms between game steps

    const DIR = { UP:{x:0,y:-1}, DOWN:{x:0,y:1}, LEFT:{x:-1,y:0}, RIGHT:{x:1,y:0} };
    const OPPOSITE = { UP:'DOWN', DOWN:'UP', LEFT:'RIGHT', RIGHT:'LEFT' };
    const KEY_MAP = {
      ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
      w:'UP', s:'DOWN', a:'LEFT', d:'RIGHT',
      W:'UP', S:'DOWN', A:'LEFT', D:'RIGHT'
    };

    // --- Offscreen grid canvas (drawn once, reused every frame) ---
    const gridCanvas = document.createElement('canvas');
    gridCanvas.width = canvas.width;
    gridCanvas.height = canvas.height;
    (function buildGrid() {
      const gc = gridCanvas.getContext('2d');
      gc.fillStyle = '#0f0f1a';
      gc.fillRect(0, 0, gridCanvas.width, gridCanvas.height);
      gc.strokeStyle = '#1a1a2e';
      gc.lineWidth = 0.5;
      // All vertical lines in one path, all horizontal in another
      gc.beginPath();
      for (let x = 1; x < COLS; x++) { gc.moveTo(x * CELL, 0); gc.lineTo(x * CELL, gridCanvas.height); }
      for (let y = 1; y < ROWS; y++) { gc.moveTo(0, y * CELL); gc.lineTo(gridCanvas.width, y * CELL); }
      gc.stroke();
    })();

    // --- Game state ---
    let snake, direction, inputQueue, food, score, gameState;
    let rafId = null;
    let lastTick = 0;

    function init() {
      snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      direction  = 'RIGHT';
      inputQueue = [];
      score      = 0;
      gameState  = 'waiting';
      updateScore();
      placeFood();
      draw(0);
    }

    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function updateScore() {
      scoreDisplay.textContent = 'SCORE: ' + score;
    }

    // --- rAF loop: game logic runs at TICK interval, draw every frame ---
    function loop(timestamp) {
      rafId = requestAnimationFrame(loop);
      if (gameState !== 'running') return;
      if (timestamp - lastTick >= TICK) {
        lastTick = timestamp;
        tick();
      }
    }

    function startLoop(timestamp) {
      lastTick = timestamp;
      gameState = 'running';
      if (!rafId) rafId = requestAnimationFrame(loop);
    }

    function stopLoop() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    function tick() {
      // Consume next queued direction (skip any that are now a 180° reversal)
      while (inputQueue.length) {
        const candidate = inputQueue.shift();
        if (candidate !== OPPOSITE[direction]) { direction = candidate; break; }
      }

      const head = snake[0];
      const d = DIR[direction];
      const nx = head.x + d.x;
      const ny = head.y + d.y;

      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) { endGame(); return; }
      if (snake.some(s => s.x === nx && s.y === ny))    { endGame(); return; }

      const newHead = { x: nx, y: ny };
      snake.unshift(newHead);

      if (nx === food.x && ny === food.y) {
        score += 10;
        updateScore();
        placeFood();
      } else {
        snake.pop();
      }

      draw(performance.now());
    }

    function endGame() {
      stopLoop();
      gameState = 'over';
      draw(0);
    }

    // --- Rendering ---
    function draw() {
      // Stamp pre-rendered grid (one drawImage instead of 42 path ops)
      ctx.drawImage(gridCanvas, 0, 0);

      // Food
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      ctx.fillStyle = '#ff4757';
      ctx.beginPath();
      ctx.arc(fx, fy, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff6b81';
      ctx.beginPath();
      ctx.arc(fx - 2, fy - 2, 3, 0, Math.PI * 2);
      ctx.fill();

      // Snake body (one fillStyle, one batch of fillRects)
      ctx.fillStyle = '#56ab2f';
      for (let i = 1; i < snake.length; i++) {
        const s = snake[i];
        ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
      }

      // Head
      const h = snake[0];
      const hx = h.x * CELL, hy = h.y * CELL;
      ctx.fillStyle = '#a8ff78';
      ctx.fillRect(hx + 1, hy + 1, CELL - 2, CELL - 2);

      // Eyes
      ctx.fillStyle = '#0f0f1a';
      const eyeOffsets = {
        RIGHT: [{dx:13,dy:5},{dx:13,dy:13}],
        LEFT:  [{dx:5, dy:5},{dx:5, dy:13}],
        UP:    [{dx:5, dy:5},{dx:13,dy:5}],
        DOWN:  [{dx:5, dy:13},{dx:13,dy:13}]
      }[direction];
      for (const o of eyeOffsets) {
        ctx.beginPath();
        ctx.arc(hx + o.dx, hy + o.dy, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Overlays
      if (gameState === 'waiting') {
        drawOverlay('SNAKE', 'Press any arrow key to start');
      } else if (gameState === 'over') {
        drawOverlay('GAME OVER', `Score: ${score}  —  Press any key to restart`);
      }
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = 'rgba(15, 15, 26, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#a8ff78';
      ctx.font = 'bold 36px Courier New';
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = '#c0c0d0';
      ctx.font = '14px Courier New';
      ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 20);
      ctx.textAlign = 'left';
    }

    // --- Input ---
    document.addEventListener('keydown', e => {
      const mapped = KEY_MAP[e.key];
      if (!mapped) return;
      e.preventDefault();

      if (gameState === 'waiting') {
        direction = mapped;
        requestAnimationFrame(ts => startLoop(ts));
        return;
      }
      if (gameState === 'over') {
        init();
        requestAnimationFrame(ts => { direction = mapped; startLoop(ts); });
        return;
      }
      // Queue up to 2 pending inputs; reject duplicates and obvious no-ops
      if (gameState === 'running' && inputQueue.length < 2) {
        const last = inputQueue.length ? inputQueue[inputQueue.length - 1] : direction;
        if (mapped !== last && mapped !== OPPOSITE[last]) {
          inputQueue.push(mapped);
        }
      }
    });

    init();
  </script>
</body>
</html>
