<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
    }
    #score-display {
      font-size: 1.4rem;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: #a8ff78;
    }
    canvas {
      border: 2px solid #4a4a6a;
      border-radius: 4px;
      display: block;
    }
    #hint {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #6a6a8a;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="score-display">SCORE: 0</div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="hint">ARROW KEYS or WASD to move</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');

    const CELL = 20;
    const COLS = canvas.width / CELL;
    const ROWS = canvas.height / CELL;
    const TICK = 150;

    const DIR = { UP: {x:0,y:-1}, DOWN: {x:0,y:1}, LEFT: {x:-1,y:0}, RIGHT: {x:1,y:0} };
    const OPPOSITE = { UP:'DOWN', DOWN:'UP', LEFT:'RIGHT', RIGHT:'LEFT' };
    const KEY_MAP = {
      ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
      w:'UP', s:'DOWN', a:'LEFT', d:'RIGHT',
      W:'UP', S:'DOWN', A:'LEFT', D:'RIGHT'
    };

    let snake, direction, nextDirection, food, score, gameState, intervalId;

    function init() {
      snake = [
        {x: 10, y: 10},
        {x: 9,  y: 10},
        {x: 8,  y: 10}
      ];
      direction = 'RIGHT';
      nextDirection = 'RIGHT';
      score = 0;
      gameState = 'waiting'; // waiting | running | over
      updateScore();
      placeFood();
      draw();
    }

    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function updateScore() {
      scoreDisplay.textContent = 'SCORE: ' + score;
    }

    function startGame() {
      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(tick, TICK);
      gameState = 'running';
    }

    function tick() {
      direction = nextDirection;
      const head = snake[0];
      const d = DIR[direction];
      const newHead = { x: head.x + d.x, y: head.y + d.y };

      // Wall collision
      if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
        endGame(); return;
      }
      // Self collision
      if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
        endGame(); return;
      }

      snake.unshift(newHead);

      if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        updateScore();
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      clearInterval(intervalId);
      intervalId = null;
      gameState = 'over';
      draw();
    }

    function draw() {
      // Background
      ctx.fillStyle = '#0f0f1a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid (subtle)
      ctx.strokeStyle = '#1a1a2e';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * CELL, 0);
        ctx.lineTo(x * CELL, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * CELL);
        ctx.lineTo(canvas.width, y * CELL);
        ctx.stroke();
      }

      // Food
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      ctx.fillStyle = '#ff4757';
      ctx.beginPath();
      ctx.arc(fx, fy, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff6b81';
      ctx.beginPath();
      ctx.arc(fx - 2, fy - 2, 3, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((seg, i) => {
        const isHead = i === 0;
        ctx.fillStyle = isHead ? '#a8ff78' : '#56ab2f';
        ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
        if (isHead) {
          // Eyes
          const ex = seg.x * CELL;
          const ey = seg.y * CELL;
          ctx.fillStyle = '#0f0f1a';
          const eyeOffsets = {
            RIGHT: [{dx:13,dy:5},{dx:13,dy:13}],
            LEFT:  [{dx:5, dy:5},{dx:5, dy:13}],
            UP:    [{dx:5, dy:5},{dx:13,dy:5}],
            DOWN:  [{dx:5, dy:13},{dx:13,dy:13}]
          }[direction];
          eyeOffsets.forEach(o => {
            ctx.beginPath();
            ctx.arc(ex + o.dx, ey + o.dy, 2, 0, Math.PI * 2);
            ctx.fill();
          });
        }
      });

      // Overlay screens
      if (gameState === 'waiting') {
        drawOverlay('SNAKE', 'Press any arrow key to start');
      } else if (gameState === 'over') {
        drawOverlay('GAME OVER', `Score: ${score}  —  Press any key to restart`);
      }
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = 'rgba(15, 15, 26, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#a8ff78';
      ctx.font = 'bold 36px Courier New';
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 20);

      ctx.fillStyle = '#c0c0d0';
      ctx.font = '14px Courier New';
      ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 20);
      ctx.textAlign = 'left';
    }

    document.addEventListener('keydown', e => {
      const mapped = KEY_MAP[e.key];
      if (!mapped) return;
      e.preventDefault();

      if (gameState === 'waiting') {
        nextDirection = mapped;
        direction = mapped;
        startGame();
        return;
      }
      if (gameState === 'over') {
        init();
        nextDirection = mapped;
        direction = mapped;
        startGame();
        return;
      }
      if (mapped !== OPPOSITE[direction]) {
        nextDirection = mapped;
      }
    });

    init();
  </script>
</body>
</html>
