<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Builder</title>
  <style>
    /* ─── Reset & Base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    input, textarea { font-family: inherit; font-size: 0.85rem; }
    button { cursor: pointer; font-family: inherit; }

    /* ─── Header ────────────────────────────────────────── */
    #app-header {
      background: #16213e;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #1e3a5f;
      flex-shrink: 0;
    }
    #app-header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #60a5fa;
      letter-spacing: 0.5px;
      margin-right: auto;
    }
    .tpl-btn {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      transition: all 0.15s;
    }
    .tpl-btn:hover { border-color: #60a5fa; color: #60a5fa; }
    .tpl-btn.active { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
    #btn-download {
      background: #16a34a;
      border: none;
      color: white;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
      margin-left: 8px;
    }
    #btn-download:hover { background: #15803d; }
    #btn-download:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }

    /* ─── App Body ──────────────────────────────────────── */
    #app-body { display: flex; flex: 1; overflow: hidden; }

    /* ─── Editor Panel ──────────────────────────────────── */
    #editor {
      width: 38%;
      min-width: 300px;
      background: #1e293b;
      overflow-y: auto;
      border-right: 1px solid #334155;
      flex-shrink: 0;
    }
    #editor::-webkit-scrollbar { width: 6px; }
    #editor::-webkit-scrollbar-track { background: #1e293b; }
    #editor::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    /* Accordion */
    .accordion { border-bottom: 1px solid #334155; }
    .accordion-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      cursor: pointer;
      user-select: none;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      transition: color 0.15s, background 0.15s;
    }
    .accordion-header:hover { color: #e2e8f0; background: #243044; }
    .accordion-header.open { color: #60a5fa; }
    .accordion-chevron { transition: transform 0.2s; font-size: 0.65rem; }
    .accordion-header.open .accordion-chevron { transform: rotate(180deg); }
    .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
    .accordion-body.open { max-height: 3000px; }
    .accordion-content { padding: 4px 20px 16px; }

    /* Form fields */
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .field-row.full { grid-template-columns: 1fr; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .field input, .field textarea {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 5px;
      color: #e2e8f0;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
      resize: vertical;
    }
    .field input:focus, .field textarea:focus { border-color: #3b82f6; }
    .field textarea { min-height: 80px; line-height: 1.5; }

    /* Dynamic entry cards */
    .entry-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      position: relative;
    }
    .entry-card .field { margin-bottom: 8px; }
    .btn-remove {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      color: #ef4444;
      font-size: 1rem;
      line-height: 1;
      padding: 2px 5px;
      border-radius: 3px;
      transition: background 0.15s;
    }
    .btn-remove:hover { background: #450a0a; }
    .btn-add {
      width: 100%;
      margin-top: 4px;
      background: transparent;
      border: 1px dashed #334155;
      color: #60a5fa;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      transition: all 0.15s;
    }
    .btn-add:hover { background: #172554; border-color: #3b82f6; }

    /* ─── Preview Panel ─────────────────────────────────── */
    #preview-panel {
      flex: 1;
      background: #cbd5e1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    #preview-inner {
      width: 700px;
      min-height: 990px;
      background: white;
      box-shadow: 0 4px 32px rgba(0,0,0,0.3);
    }

    /* ══════════════════════════════════════════════════════
       TEMPLATE: MODERN
    ══════════════════════════════════════════════════════ */
    .tpl-modern {
      display: flex;
      min-height: 990px;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* Sidebar */
    .tpl-modern .m-sidebar {
      width: 240px;
      min-width: 240px;
      background: #1e3a5f;
      color: #e2e8f0;
      padding: 36px 22px;
    }
    .tpl-modern .m-avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      font-weight: 700;
      color: #fff;
      margin: 0 auto 18px;
      letter-spacing: 1px;
    }
    .tpl-modern .m-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .tpl-modern .m-title {
      font-size: 0.75rem;
      color: #93c5fd;
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.4;
    }
    .tpl-modern .m-section {
      margin-bottom: 24px;
    }
    .tpl-modern .m-section-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #60a5fa;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid #2d5a8e;
    }
    .tpl-modern .m-contact-item {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      font-size: 0.76rem;
      color: #cbd5e1;
      margin-bottom: 8px;
      line-height: 1.4;
      word-break: break-all;
    }
    .tpl-modern .m-contact-item .icon {
      color: #93c5fd;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .tpl-modern .m-skill {
      display: inline-block;
      background: #1e4d7b;
      color: #bae6fd;
      font-size: 0.7rem;
      padding: 3px 9px;
      border-radius: 99px;
      margin: 3px 3px 0 0;
      line-height: 1.5;
    }

    /* Main content */
    .tpl-modern .m-main {
      flex: 1;
      padding: 36px 30px;
    }
    .tpl-modern .m-block {
      margin-bottom: 26px;
    }
    .tpl-modern .m-block-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #1d4ed8;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 2px solid #dbeafe;
    }
    .tpl-modern .m-summary {
      font-size: 0.85rem;
      color: #374151;
      line-height: 1.75;
    }
    .tpl-modern .m-entry {
      margin-bottom: 16px;
    }
    .tpl-modern .m-entry-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1px;
    }
    .tpl-modern .m-entry-role {
      font-size: 0.9rem;
      font-weight: 700;
      color: #111827;
    }
    .tpl-modern .m-entry-period {
      font-size: 0.73rem;
      color: #6b7280;
      white-space: nowrap;
      margin-left: 8px;
    }
    .tpl-modern .m-entry-company {
      font-size: 0.78rem;
      color: #4b5563;
      margin-bottom: 6px;
    }
    .tpl-modern .m-entry-bullets {
      padding-left: 16px;
      margin-top: 4px;
    }
    .tpl-modern .m-entry-bullets li {
      font-size: 0.81rem;
      color: #374151;
      line-height: 1.65;
      margin-bottom: 3px;
    }
    .tpl-modern .m-edu-school {
      font-size: 0.88rem;
      font-weight: 700;
      color: #111827;
    }
    .tpl-modern .m-edu-degree {
      font-size: 0.8rem;
      color: #4b5563;
      margin-top: 2px;
    }
    .tpl-modern .m-edu-note {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 2px;
    }
    .tpl-modern .m-avatar-img {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 18px;
      border: 3px solid #3b82f6;
    }

    /* Photo upload */
    .photo-upload-area {
      background: #0f172a;
      border: 1px dashed #334155;
      border-radius: 5px;
      padding: 11px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      font-size: 0.82rem;
      color: #64748b;
    }
    .photo-upload-area:hover { border-color: #3b82f6; color: #60a5fa; }
    .photo-upload-area.has-photo { border-style: solid; border-color: #22c55e; color: #22c55e; }

    /* ══════════════════════════════════════════════════════
       TEMPLATE: CLASSIC
    ══════════════════════════════════════════════════════ */
    .tpl-classic {
      padding: 52px 56px;
      font-family: Georgia, 'Times New Roman', serif;
      color: #1a1a1a;
      background: #fff;
      min-height: 990px;
    }
    .tpl-classic .c-header { text-align: center; margin-bottom: 18px; }
    .tpl-classic .c-name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #111;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .tpl-classic .c-title {
      font-size: 0.9rem;
      color: #555;
      font-style: italic;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .tpl-classic .c-contact {
      font-size: 0.78rem;
      color: #555;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .tpl-classic .c-contact .sep { margin: 0 7px; color: #ccc; }
    .tpl-classic .c-rule { border: none; border-top: 1.5px solid #222; margin: 16px 0 14px; }
    .tpl-classic .c-rule-thin { border: none; border-top: 0.5px solid #ddd; margin: 10px 0; }
    .tpl-classic .c-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #222;
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin-bottom: 12px;
    }
    .tpl-classic .c-summary {
      font-size: 0.88rem;
      line-height: 1.78;
      color: #333;
    }
    .tpl-classic .c-entry { margin-bottom: 14px; }
    .tpl-classic .c-entry-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .tpl-classic .c-entry-role {
      font-size: 0.92rem;
      font-weight: 700;
      color: #111;
    }
    .tpl-classic .c-entry-period {
      font-size: 0.76rem;
      color: #666;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .tpl-classic .c-entry-sub {
      font-size: 0.84rem;
      color: #444;
      font-style: italic;
      margin-bottom: 5px;
    }
    .tpl-classic .c-bullets {
      padding-left: 18px;
      margin-top: 4px;
    }
    .tpl-classic .c-bullets li {
      font-size: 0.84rem;
      color: #333;
      line-height: 1.65;
      margin-bottom: 3px;
    }
    .tpl-classic .c-skills {
      font-size: 0.86rem;
      color: #333;
      line-height: 1.75;
    }

    /* ══════════════════════════════════════════════════════
       TEMPLATE: MINIMAL
    ══════════════════════════════════════════════════════ */
    .tpl-minimal {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #1a1a1a;
      background: #fff;
      min-height: 990px;
    }
    .tpl-minimal .n-accent { height: 4px; background: #0ea5e9; }
    .tpl-minimal .n-body { padding: 44px 52px; }
    .tpl-minimal .n-header { margin-bottom: 34px; }
    .tpl-minimal .n-name {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: -0.5px;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .tpl-minimal .n-title {
      font-size: 1rem;
      color: #0ea5e9;
      font-weight: 500;
      margin-bottom: 10px;
    }
    .tpl-minimal .n-contact {
      font-size: 0.78rem;
      color: #64748b;
    }
    .tpl-minimal .n-contact .sep { margin: 0 8px; color: #cbd5e1; }
    .tpl-minimal .n-section { margin-bottom: 28px; }
    .tpl-minimal .n-section-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 12px;
      padding-bottom: 7px;
      border-bottom: 1px solid #f1f5f9;
    }
    .tpl-minimal .n-summary {
      font-size: 0.88rem;
      color: #374151;
      line-height: 1.8;
    }
    .tpl-minimal .n-entry {
      display: flex;
      gap: 20px;
      margin-bottom: 18px;
    }
    .tpl-minimal .n-period {
      width: 96px;
      min-width: 96px;
      font-size: 0.73rem;
      color: #94a3b8;
      padding-top: 3px;
      line-height: 1.4;
    }
    .tpl-minimal .n-entry-main { flex: 1; }
    .tpl-minimal .n-entry-role {
      font-size: 0.9rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 2px;
    }
    .tpl-minimal .n-entry-sub {
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 5px;
    }
    .tpl-minimal .n-bullets {
      padding-left: 14px;
    }
    .tpl-minimal .n-bullets li {
      font-size: 0.82rem;
      color: #374151;
      line-height: 1.65;
      margin-bottom: 3px;
    }
    .tpl-minimal .n-skills {
      font-size: 0.85rem;
      color: #374151;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header id="app-header">
  <h1>Resume Builder</h1>
  <button class="tpl-btn active" data-tpl="modern">Modern</button>
  <button class="tpl-btn" data-tpl="classic">Classic</button>
  <button class="tpl-btn" data-tpl="minimal">Minimal</button>
  <button id="btn-download">⬇ Download PDF</button>
</header>

<!-- ── App Body ── -->
<div id="app-body">

  <!-- Editor -->
  <div id="editor">

    <div class="accordion" id="acc-personal">
      <div class="accordion-header open" onclick="toggleAccordion('acc-personal')">
        Personal Info <span class="accordion-chevron">▲</span>
      </div>
      <div class="accordion-body open">
        <div class="accordion-content">
          <div class="field-row">
            <div class="field"><label>Full Name</label><input type="text" data-field="name"></div>
            <div class="field"><label>Job Title</label><input type="text" data-field="jobTitle"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Email</label><input type="email" data-field="email"></div>
            <div class="field"><label>Phone</label><input type="tel" data-field="phone"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Location</label><input type="text" data-field="location"></div>
            <div class="field"><label>LinkedIn</label><input type="text" data-field="linkedin"></div>
          </div>
          <div class="field-row full">
            <div class="field">
              <label>Profile Photo (Modern template)</label>
              <div class="photo-upload-area" id="photo-upload-area"
                   onclick="document.getElementById('photo-input').click()">
                <span id="photo-upload-label">📷 Click to upload photo</span>
              </div>
              <input type="file" id="photo-input" accept="image/*" style="display:none">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="accordion" id="acc-summary">
      <div class="accordion-header open" onclick="toggleAccordion('acc-summary')">
        Summary <span class="accordion-chevron">▲</span>
      </div>
      <div class="accordion-body open">
        <div class="accordion-content">
          <div class="field-row full">
            <div class="field">
              <label>Professional Summary</label>
              <textarea data-field="summary" rows="4"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="accordion" id="acc-exp">
      <div class="accordion-header open" onclick="toggleAccordion('acc-exp')">
        Experience <span class="accordion-chevron">▲</span>
      </div>
      <div class="accordion-body open">
        <div class="accordion-content">
          <div id="exp-cards"></div>
          <button class="btn-add" onclick="addEntry('experience')">+ Add Experience</button>
        </div>
      </div>
    </div>

    <div class="accordion" id="acc-edu">
      <div class="accordion-header open" onclick="toggleAccordion('acc-edu')">
        Education <span class="accordion-chevron">▲</span>
      </div>
      <div class="accordion-body open">
        <div class="accordion-content">
          <div id="edu-cards"></div>
          <button class="btn-add" onclick="addEntry('education')">+ Add Education</button>
        </div>
      </div>
    </div>

    <div class="accordion" id="acc-skills">
      <div class="accordion-header open" onclick="toggleAccordion('acc-skills')">
        Skills <span class="accordion-chevron">▲</span>
      </div>
      <div class="accordion-body open">
        <div class="accordion-content">
          <div class="field-row full">
            <div class="field">
              <label>Skills (comma-separated)</label>
              <textarea data-field="skills" rows="3"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /editor -->

  <!-- Preview -->
  <div id="preview-panel">
    <div id="preview-inner">
      <!-- rendered by JS -->
    </div>
  </div>

</div><!-- /app-body -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ─── Data ────────────────────────────────────────────────
let currentTemplate = 'modern';

let resume = {
  photo:    null,
  name:     'Alex Johnson',
  jobTitle: 'Senior Software Engineer',
  email:    'alex@example.com',
  phone:    '+1 (555) 123-4567',
  location: 'San Francisco, CA',
  linkedin: 'linkedin.com/in/alexjohnson',
  summary:  'Experienced software engineer with 6+ years building scalable web applications. Passionate about clean code, developer experience, and shipping products users love.',
  experience: [
    {
      company: 'Acme Corp',
      role:    'Senior Software Engineer',
      period:  '2021 – Present',
      bullets: 'Led migration of monolith to microservices, reducing deployment time by 60%\nMentored 4 junior engineers and conducted weekly code reviews\nBuilt real-time analytics dashboard serving 500k daily active users'
    },
    {
      company: 'Startup Inc',
      role:    'Software Engineer',
      period:  '2018 – 2021',
      bullets: 'Developed REST APIs consumed by iOS and Android apps\nImproved test coverage from 40% to 90%, cutting production bugs by half\nIntegrated third-party payment processing handling $2M+ monthly'
    }
  ],
  education: [
    {
      school: 'University of California, Berkeley',
      degree: 'B.S. Computer Science',
      period: '2014 – 2018',
      note:   'GPA: 3.8 / 4.0'
    }
  ],
  skills: 'JavaScript, TypeScript, React, Node.js, Python, PostgreSQL, Docker, AWS, Git'
};

// ─── Helpers ─────────────────────────────────────────────
function esc(str) {
  return (str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function initials(name) {
  return (name || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

function bulletsHTML(text, cls) {
  const lines = (text || '').split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return '';
  return `<ul class="${cls}">${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
}

// ─── Template: Modern ────────────────────────────────────
function renderModern(r) {
  const skills = (r.skills || '').split(',').map(s => s.trim()).filter(Boolean);

  const expHTML = r.experience.map(e => `
    <div class="m-entry">
      <div class="m-entry-top">
        <span class="m-entry-role">${esc(e.role)}</span>
        <span class="m-entry-period">${esc(e.period)}</span>
      </div>
      <div class="m-entry-company">${esc(e.company)}</div>
      ${bulletsHTML(e.bullets, 'm-entry-bullets')}
    </div>`).join('');

  const eduHTML = r.education.map(e => `
    <div class="m-entry">
      <div class="m-entry-top">
        <span class="m-edu-school">${esc(e.school)}</span>
        <span class="m-entry-period">${esc(e.period)}</span>
      </div>
      <div class="m-edu-degree">${esc(e.degree)}</div>
      ${e.note ? `<div class="m-edu-note">${esc(e.note)}</div>` : ''}
    </div>`).join('');

  return `
  <div class="tpl-modern">
    <div class="m-sidebar">
      ${r.photo
        ? `<img class="m-avatar-img" src="${r.photo}" alt="photo">`
        : `<div class="m-avatar">${esc(initials(r.name))}</div>`}
      <div class="m-name">${esc(r.name) || 'Your Name'}</div>
      <div class="m-title">${esc(r.jobTitle)}</div>
      <div class="m-section">
        <div class="m-section-label">Contact</div>
        ${r.email    ? `<div class="m-contact-item"><span class="icon">✉</span>${esc(r.email)}</div>`    : ''}
        ${r.phone    ? `<div class="m-contact-item"><span class="icon">✆</span>${esc(r.phone)}</div>`    : ''}
        ${r.location ? `<div class="m-contact-item"><span class="icon">⌖</span>${esc(r.location)}</div>` : ''}
        ${r.linkedin ? `<div class="m-contact-item"><span class="icon">in</span>${esc(r.linkedin)}</div>`: ''}
      </div>
      ${skills.length ? `
      <div class="m-section">
        <div class="m-section-label">Skills</div>
        ${skills.map(s => `<span class="m-skill">${esc(s)}</span>`).join('')}
      </div>` : ''}
    </div>
    <div class="m-main">
      ${r.summary ? `
      <div class="m-block">
        <div class="m-block-label">Summary</div>
        <p class="m-summary">${esc(r.summary)}</p>
      </div>` : ''}
      ${r.experience.length ? `
      <div class="m-block">
        <div class="m-block-label">Experience</div>
        ${expHTML}
      </div>` : ''}
      ${r.education.length ? `
      <div class="m-block">
        <div class="m-block-label">Education</div>
        ${eduHTML}
      </div>` : ''}
    </div>
  </div>`;
}

// ─── Template: Classic ───────────────────────────────────
function renderClassic(r) {
  const contact = [r.email, r.phone, r.location, r.linkedin].filter(Boolean);

  const expHTML = r.experience.map((e, i) => `
    ${i > 0 ? '<hr class="c-rule-thin">' : ''}
    <div class="c-entry">
      <div class="c-entry-top">
        <span class="c-entry-role">${esc(e.role)}</span>
        <span class="c-entry-period">${esc(e.period)}</span>
      </div>
      <div class="c-entry-sub">${esc(e.company)}</div>
      ${bulletsHTML(e.bullets, 'c-bullets')}
    </div>`).join('');

  const eduHTML = r.education.map((e, i) => `
    ${i > 0 ? '<hr class="c-rule-thin">' : ''}
    <div class="c-entry">
      <div class="c-entry-top">
        <span class="c-entry-role">${esc(e.school)}</span>
        <span class="c-entry-period">${esc(e.period)}</span>
      </div>
      <div class="c-entry-sub">${esc(e.degree)}${e.note ? ' — ' + esc(e.note) : ''}</div>
    </div>`).join('');

  return `
  <div class="tpl-classic">
    <div class="c-header">
      <div class="c-name">${esc(r.name) || 'Your Name'}</div>
      <div class="c-title">${esc(r.jobTitle)}</div>
      <div class="c-contact">${contact.map(c => esc(c)).join('<span class="sep">·</span>')}</div>
    </div>
    ${r.summary ? `<hr class="c-rule"><div class="c-section-title">Professional Summary</div><p class="c-summary">${esc(r.summary)}</p>` : ''}
    ${r.experience.length ? `<hr class="c-rule"><div class="c-section-title">Experience</div>${expHTML}` : ''}
    ${r.education.length  ? `<hr class="c-rule"><div class="c-section-title">Education</div>${eduHTML}` : ''}
    ${r.skills ? `<hr class="c-rule"><div class="c-section-title">Skills</div><p class="c-skills">${esc(r.skills)}</p>` : ''}
  </div>`;
}

// ─── Template: Minimal ───────────────────────────────────
function renderMinimal(r) {
  const contact = [r.email, r.phone, r.location, r.linkedin].filter(Boolean);

  const expHTML = r.experience.map(e => `
    <div class="n-entry">
      <div class="n-period">${esc(e.period)}</div>
      <div class="n-entry-main">
        <div class="n-entry-role">${esc(e.role)}</div>
        <div class="n-entry-sub">${esc(e.company)}</div>
        ${bulletsHTML(e.bullets, 'n-bullets')}
      </div>
    </div>`).join('');

  const eduHTML = r.education.map(e => `
    <div class="n-entry">
      <div class="n-period">${esc(e.period)}</div>
      <div class="n-entry-main">
        <div class="n-entry-role">${esc(e.school)}</div>
        <div class="n-entry-sub">${esc(e.degree)}${e.note ? ' · ' + esc(e.note) : ''}</div>
      </div>
    </div>`).join('');

  return `
  <div class="tpl-minimal">
    <div class="n-accent"></div>
    <div class="n-body">
      <div class="n-header">
        <div class="n-name">${esc(r.name) || 'Your Name'}</div>
        <div class="n-title">${esc(r.jobTitle)}</div>
        <div class="n-contact">${contact.map(c => esc(c)).join('<span class="sep">|</span>')}</div>
      </div>
      ${r.summary ? `<div class="n-section"><div class="n-section-label">About</div><p class="n-summary">${esc(r.summary)}</p></div>` : ''}
      ${r.experience.length ? `<div class="n-section"><div class="n-section-label">Experience</div>${expHTML}</div>` : ''}
      ${r.education.length  ? `<div class="n-section"><div class="n-section-label">Education</div>${eduHTML}</div>`  : ''}
      ${r.skills ? `<div class="n-section"><div class="n-section-label">Skills</div><p class="n-skills">${esc(r.skills)}</p></div>` : ''}
    </div>
  </div>`;
}

// ─── Render Preview ──────────────────────────────────────
function renderPreview() {
  const el = document.getElementById('preview-inner');
  if (currentTemplate === 'modern')  el.innerHTML = renderModern(resume);
  if (currentTemplate === 'classic') el.innerHTML = renderClassic(resume);
  if (currentTemplate === 'minimal') el.innerHTML = renderMinimal(resume);
}

// ─── Editor: static fields ───────────────────────────────
function initStaticFields() {
  document.querySelectorAll('[data-field]').forEach(input => {
    const field = input.dataset.field;
    input.value = resume[field] || '';
    input.addEventListener('input', () => {
      resume[field] = input.value;
      renderPreview();
    });
  });
}

// ─── Editor: experience cards ────────────────────────────
function renderExpCards() {
  document.getElementById('exp-cards').innerHTML = resume.experience.map((e, i) => `
    <div class="entry-card">
      <button class="btn-remove" onclick="removeEntry('experience',${i})">✕</button>
      <div class="field"><label>Company</label>
        <input type="text" value="${esc(e.company)}"
          oninput="resume.experience[${i}].company=this.value;renderPreview()">
      </div>
      <div class="field"><label>Role / Title</label>
        <input type="text" value="${esc(e.role)}"
          oninput="resume.experience[${i}].role=this.value;renderPreview()">
      </div>
      <div class="field"><label>Period</label>
        <input type="text" value="${esc(e.period)}"
          oninput="resume.experience[${i}].period=this.value;renderPreview()">
      </div>
      <div class="field"><label>Bullet Points (one per line)</label>
        <textarea rows="4"
          oninput="resume.experience[${i}].bullets=this.value;renderPreview()">${esc(e.bullets)}</textarea>
      </div>
    </div>`).join('');
}

// ─── Editor: education cards ─────────────────────────────
function renderEduCards() {
  document.getElementById('edu-cards').innerHTML = resume.education.map((e, i) => `
    <div class="entry-card">
      <button class="btn-remove" onclick="removeEntry('education',${i})">✕</button>
      <div class="field"><label>School</label>
        <input type="text" value="${esc(e.school)}"
          oninput="resume.education[${i}].school=this.value;renderPreview()">
      </div>
      <div class="field"><label>Degree</label>
        <input type="text" value="${esc(e.degree)}"
          oninput="resume.education[${i}].degree=this.value;renderPreview()">
      </div>
      <div class="field"><label>Period</label>
        <input type="text" value="${esc(e.period)}"
          oninput="resume.education[${i}].period=this.value;renderPreview()">
      </div>
      <div class="field"><label>Note (GPA, honors, etc.)</label>
        <input type="text" value="${esc(e.note)}"
          oninput="resume.education[${i}].note=this.value;renderPreview()">
      </div>
    </div>`).join('');
}

// ─── Add / Remove entries ────────────────────────────────
function addEntry(type) {
  if (type === 'experience') {
    resume.experience.push({ company: '', role: '', period: '', bullets: '' });
    renderExpCards();
  } else {
    resume.education.push({ school: '', degree: '', period: '', note: '' });
    renderEduCards();
  }
  renderPreview();
}

function removeEntry(type, i) {
  if (type === 'experience') { resume.experience.splice(i, 1); renderExpCards(); }
  else                       { resume.education.splice(i, 1);  renderEduCards(); }
  renderPreview();
}

// ─── Accordion ───────────────────────────────────────────
function toggleAccordion(id) {
  const acc  = document.getElementById(id);
  const hdr  = acc.querySelector('.accordion-header');
  const body = acc.querySelector('.accordion-body');
  hdr.classList.toggle('open');
  body.classList.toggle('open');
}

// ─── Template switching ──────────────────────────────────
document.querySelectorAll('.tpl-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTemplate = btn.dataset.tpl;
    renderPreview();
  });
});

// ─── PDF Download ────────────────────────────────────────
document.getElementById('btn-download').addEventListener('click', async () => {
  const btn = document.getElementById('btn-download');
  btn.disabled = true;
  btn.textContent = 'Generating…';
  try {
    const el = document.getElementById('preview-inner');
    const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
    const { jsPDF } = window.jspdf;
    const pdf  = new jsPDF('p', 'mm', 'a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgData = canvas.toDataURL('image/png');
    const imgH = (canvas.height * pageW) / canvas.width;
    let y = 0;
    while (y < imgH) {
      if (y > 0) pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, -y, pageW, imgH);
      y += pageH;
    }
    const filename = (resume.name || 'resume').replace(/\s+/g, '-').toLowerCase();
    pdf.save(`${filename}.pdf`);
  } finally {
    btn.disabled = false;
    btn.textContent = '⬇ Download PDF';
  }
});

// ─── Photo upload ─────────────────────────────────────────
document.getElementById('photo-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    resume.photo = ev.target.result;
    document.getElementById('photo-upload-area').classList.add('has-photo');
    document.getElementById('photo-upload-label').textContent = '✓ ' + file.name;
    renderPreview();
  };
  reader.readAsDataURL(file);
});

// ─── Init ────────────────────────────────────────────────
initStaticFields();
renderExpCards();
renderEduCards();
renderPreview();
</script>
